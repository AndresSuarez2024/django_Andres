version: '3.9'
services:
  db:
    image: postgres:15
    container_name: login_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: andres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: