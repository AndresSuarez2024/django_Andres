<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Detalle Alumno</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
</head>
<body>
    <h1>Detalles del alumno</h1>
    <p><strong>ID:</strong> {{ student.id }}</p>
    <p><strong>Nombre:</strong> {{ student.first_name }}</p>
    <p><strong>Apellidos:</strong> {{ student.last_name1 }} {{ student.last_name2 }}</p>
    <p><strong>Email:</strong> {{ student.email }}</p>
    <p><strong>Curs:</strong> {{ student.course }}</p>
    <p><strong>Módulo:</strong> {{ student.modules }}</p>
    <a href="{% url 'students' %}">Volver a la lista</a>
</body>
</html>
